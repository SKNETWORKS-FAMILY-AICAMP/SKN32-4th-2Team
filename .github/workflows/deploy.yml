name: Deploy to EC2 via SSM

on:
  push:
    branches:
      - main
    paths:
      - 'web/**'
      - 'RAG/**'
      - 'LLM/**'
      - 'nginx/**'
      - 'scripts/**'
      - 'docker-compose.yml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:   # 필요 시 수동 실행도 가능하게

env:
  AWS_REGION: ap-northeast-2
  PROJECT_DIR: /home/ubuntu/SKN32-4th-2Team   # 실제 clone 경로로 고정

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC 인증에 필요
      contents: read

    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/skn-github-actions-ecr-oidc-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to EC2 via SSM
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          PROJECT_DIR: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy $(git rev-parse --short HEAD)" \
            --timeout-seconds 3600 \
            --parameters commands="[
              \"set -e\",
              \"cd $PROJECT_DIR\",
              \"git fetch origin\",
              \"git checkout main\",
              \"git pull origin main\",
              \"chmod +x scripts/fetch_env.sh\",
              \"./scripts/fetch_env.sh web\",
              \"./scripts/fetch_env.sh rag\",
              \"./scripts/fetch_env.sh llm\",
              \"docker compose build\",
              \"docker compose up -d\",
              \"docker image prune -f\"
            ]" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          # 최초 배포(볼륨 없음) 시 RAG bootstrap이 최대 20분 이상 걸릴 수 있으므로
          # wait 자체도 넉넉하게 폴링 (기본 wait는 내부적으로 재시도하며 최종 상태를 기다림)
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" || true

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --output table

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "Status" \
            --output text)

          echo "Final status: $STATUS"

          if [ "$STATUS" != "Success" ]; then
            echo "Deployment failed on EC2 (status: $STATUS)"
            exit 1
          fi

      - name: Verify deployment
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          PROJECT_DIR: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Verify deployment - docker compose ps" \
            --parameters commands="[
              \"cd $PROJECT_DIR\",
              \"docker compose ps\"
            ]" \
            --query "Command.CommandId" \
            --output text)

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" || true

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --output table