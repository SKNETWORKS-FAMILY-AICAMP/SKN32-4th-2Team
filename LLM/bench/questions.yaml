  # 근로기준법 제56조(휴일근로 100분의 50 가산)가 정답인데, 검색된 청크가
  # 조문 중간부터 시작해 "제56조" 라는 머리가 안 보인다. 그러면 모델이 기억으로
  # 번호를 붙여 제55조·제57조 같은 무관한 조문을 대고, "1.5배" 처럼 문서에 없는
  # 표현으로 바꿔 말하기도 했다.
  # 사내 규정에는 공휴일 '급여' 규정이 없다(복무규정 제18조는 휴일 지정,
  # 제25조는 휴가일수 계산, 유연근무제 지침 제26조는 근무시간 처리다).
  # 따라서 정답 문서는 근로기준법 하나뿐이다.
