# 성능 평가용 질문 세트
#
# 각 항목:
#   id            고유 식별자. paraphrase 그룹은 접미사(-a/-b/-c)로 묶는다
#   question      실제로 /v1/chat 에 보낼 질문
#   category      정답 주제 (app/domain.py 의 TOPIC_CATEGORIES 8종 중 하나)
#   sources       정답 근거 문서 파일명. RAG 검색 결과에 이 중 하나라도
#                 들어오면 recall 성공으로 본다 (RAG/res/pdf 실제 파일명)
#   group         같은 의도의 패러프레이즈 묶음. 분류 '일관성' 측정에 쓴다
#   note          채점 시 참고할 메모 (선택)
#
# ── 왜 이렇게 만들었나 ────────────────────────────────────────────────
# 1. sources 는 '문서명'까지만 정답으로 둔다. 조문/페이지까지 맞추라고 하면
#    RAG 의 청킹 방식이 바뀔 때마다 정답을 다시 써야 한다.
# 2. 법령은 법률/시행령/시행규칙이 따로 있어 어느 쪽이 걸릴지 모른다.
#    같은 법의 여러 파일을 모두 정답으로 인정한다.
# 3. paraphrase 그룹(같은 의도, 다른 문장)이 핵심이다. 대시보드 도넛 차트가
#    믿을 만하려면 "휴가 며칠?"과 "연차 얼마나 남았어요?"가 같은 카테고리로
#    가야 한다. 정확도보다 이 '일관성'이 더 중요한 지표다.
# 4. out_of_scope 질문(HR 무관)을 넣어 '기타' 로 잘 빠지는지, 그리고
#    없는 내용을 지어내지 않는지 본다.

meta:
  categories:
    - 휴가/휴직
    - 근태/근무형태
    - 급여/보수
    - 채용/임용
    - 인사/승진
    - 복리후생
    - 징계/행동강령
    - 기타
  corpus: RAG/res/pdf   # 정답 문서명의 출처

