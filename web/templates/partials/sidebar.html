<aside class="app-sidebar">
  {% if not user.is_admin %}
  <div class="nav-group">
    <div class="nav-group-label">챗봇</div>
    <a class="nav-item {% if active == 'chat_new' %}active{% endif %}" href="/chat">
      <span class="label">+ 새 대화</span>
    </a>
  </div>

  <div class="nav-group">
    <div class="nav-group-label">대화 목록</div>
    <div id="chatroom-list" class="chatroom-list" data-active-id="{{ chatroom_id }}"></div>
  </div>
  {% endif %}

  {% if user.is_admin %}
  <div class="nav-group">
    <div class="nav-group-label">관리자</div>
    <a class="nav-item {% if active == 'admin_stats' %}active{% endif %}" href="/admin/stats">
      <span class="label">통계</span>
    </a>
    <a class="nav-item {% if active == 'admin_docs' %}active{% endif %}" href="/admin/documents">
      <span class="label">RAG 문서관리</span>
    </a>
    <a class="nav-item {% if active == 'admin_users' %}active{% endif %}" href="/admin/users">
      <span class="label">사용자 관리</span>
    </a>
  </div>
  {% endif %}
</aside>
